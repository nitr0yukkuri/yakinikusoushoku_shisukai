# Minimal Render spec (service)
services:
  - type: web
    name: matsunya-backend
    env: docker
    plan: starter
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
      - key: GOOGLE_MAPS_API_KEY
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
      - key: GOOGLE_IOS_CLIENT_ID
      - key: GOOGLE_ANDROID_CLIENT_ID
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
